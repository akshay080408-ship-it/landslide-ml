<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LandSense ML - Field Report</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#181b14">
  <style>
    :root {
      --bg-map:       #12140f;
      --bg-panel:     #181b14;
      --bg-raised:    #1f2318;
      --line:         #333829;
      --paper:        #ece7d8;
      --paper-dim:    #8d8f79;
      --moss:         #7a9b6e;
      --ochre:        #c98a3b;
      --clay:         #b3483a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: var(--bg-map); 
      color: var(--paper); 
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 30px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header { text-align: center; margin-bottom: 24px; }
    .logo { font-size: 22px; font-weight: 700; }
    .logo span { color: var(--moss); }
    .subtitle { font-size: 12px; color: var(--paper-dim); margin-top: 4px; }
    
    form { 
      width: 100%; 
      max-width: 440px;
      background: var(--bg-panel); 
      border: 1px solid var(--line); 
      border-radius: 6px; 
      padding: 24px;
    }
    label { 
      display: block; 
      margin-top: 18px; 
      font-size: 11px; 
      text-transform: uppercase;
      color: var(--paper-dim); 
      font-weight: 600;
    }
    label:first-of-type { margin-top: 0; }
    input[type=text], textarea, select { 
      width: 100%; 
      padding: 9px 10px; 
      margin-top: 6px;
      background: var(--bg-raised); 
      color: var(--paper); 
      border: 1px solid var(--line); 
      border-radius: 4px; 
      font-family: inherit;
      font-size: 13.5px;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus, select:focus { outline: 1px solid var(--moss); }
    
    /* Road status pills */
    .road-status-options { 
      display: flex; 
      gap: 8px; 
      margin-top: 8px;
    }
    .road-status-options label { 
      flex: 1;
      margin: 0;
      text-transform: none;
      font-size: 12px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      color: var(--paper-dim);
    }
    .road-status-options input { display: none; }
    .road-status-options input:checked + span { font-weight: 600; }
    .road-status-options input[value="OPEN"]:checked + span { color: var(--moss); }
    .road-status-options input[value="CAUTION"]:checked + span { color: var(--ochre); }
    .road-status-options input[value="BLOCKED"]:checked + span { color: var(--clay); }
    .road-status-options label:has(input[value="OPEN"]:checked) { border-color: var(--moss); }
    .road-status-options label:has(input[value="CAUTION"]:checked) { border-color: var(--ochre); }
    .road-status-options label:has(input[value="BLOCKED"]:checked) { border-color: var(--clay); }
    
    button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 22px; 
      background: var(--moss); 
      color: #12140f; 
      border: none; 
      border-radius: 4px; 
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .status { 
      max-width: 440px;
      width: 100%;
      margin-top: 16px; 
      padding: 12px 14px; 
      border-radius: 4px; 
      font-size: 13px;
      display: none;
    }
    .status.success { 
      background: rgba(122,155,110,0.12); 
      color: var(--moss); 
      border: 1px solid var(--moss);
    }
    .status.error { 
      background: rgba(179,72,58,0.12); 
      color: var(--clay); 
      border: 1px solid var(--clay);
    }
    .hint { font-size: 11px; color: var(--paper-dim); margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">LandSense<span>ML</span></div>
    <div class="subtitle">Field / Citizen Hazard Report</div>
  </header>
  
  <form id="reportForm">
    <label for="location">Location</label>
    <input type="text" id="location" placeholder="e.g., NH-40 near Shillong, 2km past the market" required>
    <div class="hint" id="geoStatus">Detecting GPS location…</div>
    
    <label for="issueType">Issue Type</label>
    <select id="issueType" required>
      <option value="">Select an issue</option>
      <option value="landslide">Landslide</option>
      <option value="blocked_road">Blocked Road</option>
      <option value="crack_slope_movement">Crack / Slope Movement</option>
      <option value="flooding">Flooding</option>
      <option value="other">Other</option>
    </select>
    
    <label>Road Status (optional)</label>
    <div class="road-status-options">
      <label><input type="radio" name="roadStatus" value="OPEN"><span>OPEN</span></label>
      <label><input type="radio" name="roadStatus" value="CAUTION"><span>CAUTION</span></label>
      <label><input type="radio" name="roadStatus" value="BLOCKED"><span>BLOCKED</span></label>
    </div>
    
    <label for="description">Description</label>
    <textarea id="description" placeholder="What did you see? Include anything that helps responders." required></textarea>
    
    <label for="photo">Photo (optional)</label>
    <input type="file" id="photo" accept="image/*" capture="environment">
    
    <label for="name">Your Name (optional)</label>
    <input type="text" id="name" placeholder="Anonymous">
    
    <button type="submit" id="submitBtn">Submit report</button>
  </form>
  
  <div id="statusMsg" class="status"></div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' 
      ? 'http://127.0.0.1:5000'
      : `${window.location.protocol}//${window.location.host}`;
    
    let userLat = null, userLng = null;
    
    // Get GPS location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          document.getElementById('geoStatus').textContent = `GPS attached (${userLat.toFixed(4)}, ${userLng.toFixed(4)})`;
        },
        () => {
          document.getElementById('geoStatus').textContent = 'GPS unavailable — enter location name manually.';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
    
    // Photo upload
    let photoBase64 = null;
    document.getElementById('photo').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) { photoBase64 = null; return; }
      const reader = new FileReader();
      reader.onload = () => { photoBase64 = reader.result; };
      reader.readAsDataURL(file);
    });
    
    // Form submission
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      status.className = '';
      
      const roadStatusEl = document.querySelector('input[name="roadStatus"]:checked');
      
      const payload = {
        location_name: document.getElementById('location').value.trim(),
        lat: userLat,
        lng: userLng,
        issue_type: document.getElementById('issueType').value,
        road_status: roadStatusEl ? roadStatusEl.value : null,
        description: document.getElementById('description').value.trim(),
        photo_base64: photoBase64,
        reporter_name: document.getElementById('name').value.trim() || 'Anonymous'
      };
      
      try {
        const resp = await fetch(`${API_BASE}/api/reports`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (data.success) {
          status.textContent = 'Report submitted — thank you. Responders can see this on the dashboard.';
          status.className = 'status success';
          document.getElementById('reportForm').reset();
          photoBase64 = null;
        } else {
          throw new Error(data.error || 'unknown error');
        }
      } catch (err) {
        status.textContent = `Could not submit: ${err.message}`;
        status.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit report';
        status.style.display = 'block';
      }
    });
    
    // PWA: register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .catch((err) => console.log('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
